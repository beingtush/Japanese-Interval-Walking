name: Wear APK

# Produces a sideloadable watch APK signed with the SAME release keystore as the phone app.
#
# This is not a convenience. The Wear Data Layer only pairs a phone and watch app that share a
# package name AND a signing certificate, so a locally debug-signed watch APK silently never
# receives anything from a release-signed phone app. Build it here or not at all.

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name to stamp into the APK'
        required: false
        default: '2.3.0'
  push:
    branches: [main, master]
    paths:
      - 'wear/**'
      - 'wear-protocol/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/wear-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run shared protocol unit tests
        run: |
          chmod +x gradlew
          ./gradlew :wear-protocol:testDebugUnitTest

      - name: Decode Keystore
        run: |
          if [ -f "keystore-base64.txt" ]; then
            base64 --decode keystore-base64.txt > "${{ github.workspace }}/my-upload-key.jks"
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
          fi

      - name: Build signed Wear APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :wear:assembleRelease -PversionName=${{ github.event.inputs.versionName || '2.3.0' }}

      - name: List build output files
        run: find wear/build/outputs/apk/ -type f || true

      - name: Upload Wear APK
        uses: actions/upload-artifact@v4
        with:
          name: jiw-tracker-wear-apk
          path: wear/build/outputs/apk/release/*.apk
          if-no-files-found: error
